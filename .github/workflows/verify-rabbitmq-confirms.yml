name: Verify RabbitMQ Publisher Confirms

on:
  push:
    branches:
      - fix/rabbitmq-routability-issue-3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-confirm-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: evolution_test
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: evolution_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evolution_test -d evolution_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: evolution_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psynthetic-test-password --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4.4.0-management-alpine@sha256:b768d2e09a809b48458d6c3c32fc2894643a6bfafd76264c120373eff0ee6532
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate PostgreSQL Prisma client
        env:
          DATABASE_PROVIDER: postgresql
        run: npm run db:generate

      - name: Apply PostgreSQL migrations in the isolated test database
        env:
          DATABASE_PROVIDER: postgresql
          DATABASE_CONNECTION_URI: postgresql://evolution_test:synthetic-test-password@127.0.0.1:5432/evolution_test
        run: npm run db:deploy

      - name: Test RabbitMQ and durable replay
        env:
          TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672
          TEST_POSTGRES_URL: postgresql://evolution_test:synthetic-test-password@127.0.0.1:5432/evolution_test
          TEST_MYSQL_URL: mysql://root:synthetic-test-password@127.0.0.1:3306/evolution_test
          TEST_PRISMA_POSTGRES_URL: postgresql://evolution_test:synthetic-test-password@127.0.0.1:5432/evolution_test
        run: npx tsx --test test/*.test.ts

      - name: Generate MySQL Prisma client
        env:
          DATABASE_PROVIDER: mysql
        run: npm run db:generate

      - name: Apply MySQL migrations in the isolated test database
        env:
          DATABASE_PROVIDER: mysql
          DATABASE_CONNECTION_URI: mysql://root:synthetic-test-password@127.0.0.1:3306/evolution_test
        run: npm run db:deploy

      - name: Test Prisma MySQL replay contract
        env:
          TEST_PRISMA_MYSQL_URL: mysql://root:synthetic-test-password@127.0.0.1:3306/evolution_test
        run: npx tsx --test test/rabbitmq-spool-prisma-mysql.integration.test.ts

      - name: Restore PostgreSQL Prisma client for build
        env:
          DATABASE_PROVIDER: postgresql
        run: npm run db:generate

      - name: Build
        run: npm run build
